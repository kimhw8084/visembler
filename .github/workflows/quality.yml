name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  production-install-and-startup:
    name: Production install and Visembler startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir .
      - name: Production import smoke
        run: |
          python - <<'PY'
          import importlib
          from importlib.metadata import version
          for distribution, expected, module in (
              ('nicegui', '3.15.0', 'nicegui'),
              ('Pillow', '12.3.0', 'PIL'),
              ('python-pptx', '1.0.2', 'pptx'),
          ):
              assert version(distribution) == expected, (distribution, version(distribution))
              importlib.import_module(module)
          for module in (
              'company_ui.products.visualizer.cli',
              'company_ui.products.visualizer.files',
              'company_ui.products.visualizer.ppt_service',
              'company_ui.products.visualizer.page',
          ):
              importlib.import_module(module)
          PY
      - name: Visembler startup smoke
        run: |
          export COMPANY_UI_ENVIRONMENT=test
          export COMPANY_UI_VISUALIZER_DATA_DIR="${RUNNER_TEMP}/visembler-data"
          export COMPANY_UI_STORAGE_SECRET="ci-visembler-storage-secret-0123456789"
          export COMPANY_UI_HOST=127.0.0.1
          export COMPANY_UI_PORT=8123
          python - <<'PY'
          import os
          from company_ui.products.visualizer.cli import build_application
          _, environment, repository = build_application(os.environ)
          assert repository.list()
          assert environment['COMPANY_UI_ENVIRONMENT'] == 'test'
          PY

  tests:
    name: Python regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest

  company-boundary:
    name: Visembler company boundary gates
    needs: [production-install-and-startup, tests, integrity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Authorization, lifecycle, and readiness tests
        run: python -m pytest tests/test_visualizer_company_boundary.py tests/test_visualizer_application_hardening.py
      - name: Company user boundary receipt
        run: python scripts/release_checks/run_company_user_acceptance.py --output company-user-acceptance.json
      - name: Local readiness receipt
        run: python scripts/release_checks/run_company_production_readiness.py --output company-readiness.json --data-dir "${RUNNER_TEMP}/visembler-readiness"
      - name: Capacity characterization receipt
        run: python scripts/release_checks/run_company_capacity.py --output company-capacity.json
      - uses: actions/upload-artifact@v4
        with:
          name: visembler-company-boundary-receipts
          path: |
            company-user-acceptance.json
            company-readiness.json
            company-capacity.json

  company-browser-boundary:
    name: Visembler multi-principal browser boundary
    needs: [production-install-and-startup, tests, integrity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,live-cert]'
      - run: python -m playwright install --with-deps chromium
      - name: Start production-mode Visembler
        env:
          COMPANY_UI_ENVIRONMENT: prod
          COMPANY_UI_HOST: 0.0.0.0
          COMPANY_UI_PORT: 8124
          COMPANY_UI_PROXY_ENABLED: "true"
          COMPANY_UI_TRUSTED_PROXIES: 127.0.0.1
          COMPANY_UI_TRUSTED_IDENTITY_PROXIES: 127.0.0.1
          COMPANY_UI_STORAGE_SECRET: ci-visembler-browser-storage-secret-0123456789
          COMPANY_UI_MIGRATION_OWNER_SUBJECT: alice
          COMPANY_UI_VISUALIZER_DATA_DIR: ${{ runner.temp }}/visembler-browser-data
        run: |
          python -c 'from company_ui.products.visualizer.cli import main; main()' > "${{ runner.temp }}/visembler-browser-server.log" 2>&1 &
          echo $! > "${{ runner.temp }}/visembler-browser-server.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8124/healthz >/dev/null && exit 0
            sleep 1
          done
          cat "${{ runner.temp }}/visembler-browser-server.log"
          exit 1
      - name: Run real browser-context acceptance
        env:
          COMPANY_UI_VISUALIZER_DATA_DIR: ${{ runner.temp }}/visembler-browser-data
        run: |
          python scripts/release_checks/run_company_user_browser_acceptance.py \
            --base-url http://127.0.0.1:8124 \
            --data-dir "$COMPANY_UI_VISUALIZER_DATA_DIR" \
            --output company-user-browser-acceptance.json
      - if: always()
        run: |
          if test -f "${{ runner.temp }}/visembler-browser-server.pid"; then kill "$(cat "${{ runner.temp }}/visembler-browser-server.pid")" || true; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visembler-company-browser-boundary
          path: |
            company-user-browser-acceptance.json
            ${{ runner.temp }}/visembler-browser-server.log

  authoring-modules:
    name: Node authoring contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e '.[test]'
      - run: node --version
      - run: python -m pytest tests/test_visualizer_authoring_p0.py tests/test_visualizer_accessibility_authoring.py tests/test_visualizer_performance.py

  company-production-boundary:
    name: Company production application boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Security, ownership, migration, recovery, and capacity characterization
        run: python scripts/release_checks/run_company_production_readiness.py --output "${RUNNER_TEMP}/visembler-company-readiness.json"
      - name: Require honest staged status
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.release_checks.run_company_production_readiness import (
              candidate_sha,
              dependency_fingerprint,
              source_manifest,
              validate_local_receipt,
          )
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'visembler-company-readiness.json').read_text())
          manifest_hash, _ = source_manifest()
          valid, errors = validate_local_receipt(
              receipt,
              sha=candidate_sha(),
              manifest_hash=manifest_hash,
              dependency_hash=dependency_fingerprint(),
          )
          assert valid, errors
          assert receipt['status'] in {'READY_FOR_COMPANY_TARGET_CERTIFICATION', 'PASS_COMPANY_MANAGED_PRODUCTION_CANDIDATE'}
          PY

  company-user-browser:
    name: Company principal browser boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[live-cert]'
      - run: python -m playwright install --with-deps chromium
      - name: Owner/editor/viewer and anonymous-route acceptance
        run: python scripts/release_checks/run_company_user_acceptance.py --output "${RUNNER_TEMP}/visembler-company-users"

  integrity:
    name: Dependency, frozen-file, and package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Runtime declaration drift
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          root = Path('.')
          requirements = [line.strip() for line in (root / 'requirements.txt').read_text().splitlines() if line.strip() and not line.lstrip().startswith('#')]
          dependencies = tomllib.loads((root / 'pyproject.toml').read_text())['project']['dependencies']
          assert requirements == dependencies, (requirements, dependencies)
          test_requirements = (root / 'requirements-test.txt').read_text()
          assert '-r requirements.txt' in test_requirements
          PY
      - name: Golden Connector hash
        run: |
          test "$(sha256sum company_ui/products/visualizer/vendor/production_core/core/GOLDEN_CONNECTOR_ENGINE_V5_FROZEN.js | awk '{print $1}')" = "d8ebd4378f01b7c52a7a4be57c578c22adf29b899cc08a370cf084881195343e"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify Visembler package content
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('dist').glob('company_ui-*.whl'))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              'company_ui/products/visualizer/assets/integrated_editor.mjs',
              'company_ui/products/visualizer/assets/integrated_editor.html',
              'company_ui/products/visualizer/contracts/ELEMENT_CAPABILITY_MATRIX.json',
              'company_ui/products/visualizer/vendor/production_core/core/GOLDEN_CONNECTOR_ENGINE_V5_FROZEN.js',
          }
          missing = required - names
          assert not missing, missing
          PY

  browser-smoke:
    name: Lightweight browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[live-cert]'
      - run: python -m playwright install --with-deps chromium
      - run: VIZ_BROWSER_SMOKE_OUTPUT_DIR="${RUNNER_TEMP}/visembler-browser-smoke" python company_ui/products/visualizer/vendor/production_core/tests/browser_smoke.py
